name: Deploy

# =============================================================================
# Runs `liquibase validate` then `liquibase update` on the target EC2 (via SSM)
# after a PR is merged to master.
#
# Flow:
#   Job 1 (validate) : scale up EC2, validate all changesets
#   Job 2 (update)   : apply changesets (liquibase update)
#   Cleanup          : scale down ASG (always)
#
# Auto-detects the target environment from the files changed in the merge commit.
# Also supports workflow_dispatch for manual deploys.
# =============================================================================

on:
  push:
    branches: [master]

  workflow_dispatch:

    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - qa
          - stg
          - uat
          - prod

      region:
        description: 'Region (PROD only): AU | EU | US | CH'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - AU
          - EU
          - US
          - CH

jobs:
  # ────────────────────────────────────────────────────────────────
  # Job 1: Setup infra, validate, and prepare for update
  # ────────────────────────────────────────────────────────────────
  validate:
    name: liquibase validate (${{ inputs.environment || 'auto-detect' }})
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      actions: read

    outputs:
      selected-env:         ${{ steps.resolve.outputs.SELECTED_ENV }}
      selected-region:      ${{ steps.resolve.outputs.SELECTED_REGION }}
      aws-region:           ${{ steps.config.outputs.AWS_REGION }}
      asg-name:             ${{ steps.config.outputs.ASG_NAME }}
      appconfig-app:        ${{ steps.config.outputs.APPCONFIG_APP }}
      appconfig-env:        ${{ steps.config.outputs.APPCONFIG_ENV }}
      role-arn:             ${{ steps.config.outputs.ROLE_ARN }}
      lb-version:           ${{ steps.versions.outputs.LB_VERSION }}
      mysql-driver-version: ${{ steps.versions.outputs.MYSQL_DRIVER_VERSION }}
      mongo-ext-version:    ${{ steps.versions.outputs.MONGO_EXT_VERSION }}
      mongo-driver-version: ${{ steps.versions.outputs.MONGO_DRIVER_VERSION }}
      skip-deploy:          ${{ steps.resolve.outputs.SKIP_DEPLOY }}

    steps:

      # ── Wait in queue (FIFO) ──────────────────────────────────
      # The shared EC2/ASG can only run one liquibase job at a time.
      # This step polls the GitHub API and waits until all older runs
      # of this workflow have completed before proceeding.
      - name: Wait in queue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ github.repository }}"
          WORKFLOW="deploy.yml"
          CURRENT_RUN_ID="${{ github.run_id }}"
          MAX_WAIT=3600; POLL=30; ELAPSED=0

          echo "Queue: waiting for older runs of $WORKFLOW to finish..."
          while true; do
            OLDER=$(curl -s \
              -H "Authorization: token $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/actions/workflows/$WORKFLOW/runs?per_page=100" \
              | jq "[.workflow_runs[] | select(.id < $CURRENT_RUN_ID and (.status == \"in_progress\" or .status == \"queued\" or .status == \"waiting\"))] | length")

            if [[ "$OLDER" -eq 0 ]]; then
              echo "No older runs ahead — proceeding."
              break
            fi
            if [[ $ELAPSED -ge $MAX_WAIT ]]; then
              echo "ERROR: Timed out after ${MAX_WAIT}s waiting in queue ($OLDER run(s) still ahead)."
              exit 1
            fi
            echo "Queue: $OLDER run(s) ahead. Waiting ${POLL}s... ($ELAPSED/${MAX_WAIT}s)"
            sleep "$POLL"; ELAPSED=$((ELAPSED + POLL))
          done

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Resolve environment + region ──────────────────────────
      - name: Resolve Environment & Region
        id: resolve
        env:
          GH_EVENT: ${{ github.event_name }}
          GH_INPUT_ENV: ${{ inputs.environment }}
          GH_INPUT_REGION: ${{ inputs.region }}
        run: |
          if [[ "$GH_EVENT" == "workflow_dispatch" ]]; then
            SELECTED_ENV="$GH_INPUT_ENV"
            SELECTED_REGION="$GH_INPUT_REGION"
            echo "Manual deploy — ENV=$SELECTED_ENV REGION=${SELECTED_REGION:-<none>}"
          else
            # Rollback trees (dbs/<env>-rollback, dbs/prod/<REGION>-rollback) are never
            # auto-run, so they must not count towards env/region detection.
            CHANGED=$(git diff --name-only HEAD~1 HEAD \
              | grep -vE '^dbs/([^/]+-rollback|prod/[^/]+-rollback)/' || true)
            echo "Changed files:"; echo "$CHANGED"

            ENVS=$(echo "$CHANGED" | grep -oP '^dbs/\K[^/]+' | sort -u)
            ENV_COUNT=$(echo "$ENVS" | grep -c . || true)

            if [[ $ENV_COUNT -eq 0 ]]; then
              echo "No dbs/ changes — skipping deploy."
              echo "SKIP_DEPLOY=true" >> $GITHUB_OUTPUT
              exit 0
            fi
            if [[ $ENV_COUNT -gt 1 ]]; then
              echo "ERROR: Multiple envs in merge commit: $ENVS"
              exit 1
            fi

            SELECTED_ENV=$(echo "$ENVS" | tr -d '[:space:]')
            SELECTED_REGION=""

            if [[ "$SELECTED_ENV" == "prod" ]]; then
              SELECTED_REGION=$(echo "$CHANGED" | grep -oP '^dbs/prod/\K[^/]+' | sort -u | head -n1)
              if [[ -z "$SELECTED_REGION" ]]; then
                echo "ERROR: prod changes must be under dbs/prod/<REGION>/"
                exit 1
              fi
            fi
          fi

          case "$SELECTED_ENV" in
            dev|qa|stg|uat|prod) ;;
            *) echo "ERROR: env '$SELECTED_ENV' is not valid"; exit 1 ;;
          esac

          echo "SELECTED_ENV=$SELECTED_ENV"       >> $GITHUB_ENV
          echo "SELECTED_REGION=$SELECTED_REGION" >> $GITHUB_ENV
          echo "SELECTED_ENV=$SELECTED_ENV"       >> $GITHUB_OUTPUT
          echo "SELECTED_REGION=$SELECTED_REGION" >> $GITHUB_OUTPUT

      # ── Set AWS config ────────────────────────────────────────
      - name: Set Config
        id: config
        if: steps.resolve.outputs.SKIP_DEPLOY != 'true'
        env:
          SECRET_DEV_ROLE: ${{ secrets.AWS_ROLE_ARN_TCP_DEV }}
          SECRET_QA_ROLE: ${{ secrets.AWS_ROLE_ARN_TCP_QA }}
          SECRET_STG_ROLE: ${{ secrets.AWS_ROLE_ARN_TCP_STG }}
          SECRET_UAT_ROLE: ${{ secrets.AWS_ROLE_ARN_TCP_UAT }}
          SECRET_PROD_ROLE: ${{ secrets.AWS_ROLE_ARN_TCP_PROD }}
          SECRET_ASG: ${{ secrets.ASG_NAME }}
        run: |
          case "$SELECTED_ENV" in
            dev)
              AWS_REGION=us-east-1;  ASG="$SECRET_ASG"; APP=tcplusdev-db-migration-github; AENV=dev;  ROLE="$SECRET_DEV_ROLE" ;;
            qa)
              AWS_REGION=us-east-1;  ASG="$SECRET_ASG"; APP=tcplusdev-db-migration-github; AENV=qa;   ROLE="$SECRET_QA_ROLE"  ;;
            stg)
              AWS_REGION=us-east-1;  ASG="$SECRET_ASG"; APP=tcplusstg-db-migration;        AENV=stg;  ROLE="$SECRET_STG_ROLE" ;;
            uat)
              AWS_REGION=us-east-1;  ASG="$SECRET_ASG"; APP=tcp-uat-db-migration;           AENV=uat;  ROLE="$SECRET_UAT_ROLE" ;;
            prod)
              case "$SELECTED_REGION" in
                US) AWS_REGION=us-east-1;      APP=tcp-us-prod-db-migration; AENV=us ;;
                EU) AWS_REGION=eu-central-1;   APP=tcp-eu-prod-db-migration; AENV=eu ;;
                AU) AWS_REGION=ap-southeast-2; APP=tcp-au-prod-db-migration; AENV=au ;;
                CH) AWS_REGION=cn-north-1;     APP=tcp-ch-prod-db-migration; AENV=ch ;;
                *) echo "ERROR: invalid region '$SELECTED_REGION'"; exit 1 ;;
              esac
              ASG="$SECRET_ASG"; ROLE="$SECRET_PROD_ROLE"
              ;;
            *) echo "ERROR: no config for env '$SELECTED_ENV'"; exit 1 ;;
          esac

          for var in AWS_REGION ASG_NAME:ASG APPCONFIG_APP:APP APPCONFIG_ENV:AENV ROLE_ARN:ROLE; do
            IFS=: read -r out_name src_name <<< "$var"
            src_name="${src_name:-$out_name}"
            echo "${out_name}=${!src_name}" >> $GITHUB_ENV
            echo "${out_name}=${!src_name}" >> $GITHUB_OUTPUT
          done

      # ── AWS credentials ───────────────────────────────────────
      - name: Configure AWS credentials
        if: steps.resolve.outputs.SKIP_DEPLOY != 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # ── Scale UP ──────────────────────────────────────────────
      - name: Scale Up ASG (0 → 1)
        if: steps.resolve.outputs.SKIP_DEPLOY != 'true'
        run: |
          aws autoscaling update-auto-scaling-group \
            --auto-scaling-group-name "$ASG_NAME" \
            --min-size 1 --desired-capacity 1 --max-size 1 --region "$AWS_REGION"

      - name: Wait for EC2 Instance
        if: steps.resolve.outputs.SKIP_DEPLOY != 'true'
        run: |
          MAX_WAIT=300; ELAPSED=0
          while true; do
            INSTANCE_ID=$(aws autoscaling describe-auto-scaling-groups \
              --auto-scaling-group-names "$ASG_NAME" --region "$AWS_REGION" \
              --query "AutoScalingGroups[0].Instances[?LifecycleState=='InService'].InstanceId" --output text)
            if [[ -n "$INSTANCE_ID" && "$INSTANCE_ID" != "None" ]]; then
              echo "INSTANCE_ID=$INSTANCE_ID" >> $GITHUB_ENV; echo "Instance: $INSTANCE_ID"; break
            fi
            [[ $ELAPSED -ge $MAX_WAIT ]] && { echo "ERROR: Timed out"; exit 1; }
            echo "Waiting... ($ELAPSED s)"; sleep 15; ELAPSED=$((ELAPSED + 15))
          done

      - name: Wait for SSM Agent
        if: steps.resolve.outputs.SKIP_DEPLOY != 'true'
        run: |
          MAX_WAIT=300; ELAPSED=0
          while true; do
            STATUS=$(aws ssm describe-instance-information --region "$AWS_REGION" \
              --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
              --query "InstanceInformationList[0].PingStatus" --output text 2>/dev/null || echo "NotReady")
            [[ "$STATUS" == "Online" ]] && { echo "SSM Online"; break; }
            [[ $ELAPSED -ge $MAX_WAIT ]] && { echo "ERROR: Timed out"; exit 1; }
            echo "SSM: $STATUS ($ELAPSED s)"; sleep 15; ELAPSED=$((ELAPSED + 15))
          done

      # ── Fetch configs from AppConfig ──────────────────────────
      - name: Fetch liquibase.env from AppConfig
        if: steps.resolve.outputs.SKIP_DEPLOY != 'true'
        run: |
          mkdir -p env
          TOKEN=$(aws appconfigdata start-configuration-session \
            --application-identifier "$APPCONFIG_APP" --environment-identifier "$APPCONFIG_ENV" \
            --configuration-profile-identifier liquibase-env --region "$AWS_REGION" \
            --query InitialConfigurationToken --output text)
          aws appconfigdata get-latest-configuration --configuration-token "$TOKEN" \
            --region "$AWS_REGION" env/liquibase.env

      - name: Fetch versions.json from AppConfig
        if: steps.resolve.outputs.SKIP_DEPLOY != 'true'
        run: |
          mkdir -p config
          TOKEN=$(aws appconfigdata start-configuration-session \
            --application-identifier "$APPCONFIG_APP" --environment-identifier "$APPCONFIG_ENV" \
            --configuration-profile-identifier liquibase-versions --region "$AWS_REGION" \
            --query InitialConfigurationToken --output text)
          aws appconfigdata get-latest-configuration --configuration-token "$TOKEN" \
            --region "$AWS_REGION" config/versions.json

      - name: Set version env vars
        id: versions
        if: steps.resolve.outputs.SKIP_DEPLOY != 'true'
        run: |
          LB_VERSION=$(jq -r '.LB_VERSION' config/versions.json)
          MYSQL_DRIVER_VERSION=$(jq -r '.MYSQL_DRIVER_VERSION' config/versions.json)
          MONGO_EXT_VERSION=$(jq -r '.MONGO_EXT_VERSION' config/versions.json)
          MONGO_DRIVER_VERSION=$(jq -r '.MONGO_DRIVER_VERSION' config/versions.json)
          for var in LB_VERSION MYSQL_DRIVER_VERSION MONGO_EXT_VERSION MONGO_DRIVER_VERSION; do
            if [[ -z "${!var}" || "${!var}" == "null" ]]; then echo "ERROR: $var missing"; exit 1; fi
          done
          echo "LB_VERSION=$LB_VERSION"                     >> $GITHUB_ENV
          echo "MYSQL_DRIVER_VERSION=$MYSQL_DRIVER_VERSION" >> $GITHUB_ENV
          echo "MONGO_EXT_VERSION=$MONGO_EXT_VERSION"       >> $GITHUB_ENV
          echo "MONGO_DRIVER_VERSION=$MONGO_DRIVER_VERSION" >> $GITHUB_ENV
          echo "LB_VERSION=$LB_VERSION"                     >> $GITHUB_OUTPUT
          echo "MYSQL_DRIVER_VERSION=$MYSQL_DRIVER_VERSION" >> $GITHUB_OUTPUT
          echo "MONGO_EXT_VERSION=$MONGO_EXT_VERSION"       >> $GITHUB_OUTPUT
          echo "MONGO_DRIVER_VERSION=$MONGO_DRIVER_VERSION" >> $GITHUB_OUTPUT

      # ── Setup EC2 workspace ───────────────────────────────────
      - name: Setup EC2 Workspace via SSM
        if: steps.resolve.outputs.SKIP_DEPLOY != 'true'
        run: |
          SOURCE_BRANCH="master"
          ENV_ENCODED=$(base64 -w 0 env/liquibase.env)
          GH_TOKEN="${{ secrets.GH_PAT }}"
          SCRIPT=$(cat <<EOF
          #!/bin/bash
          set -e
          mkdir -p /opt/liquibase-runner/env
          echo "${ENV_ENCODED}" | base64 -d > /opt/liquibase-runner/env/liquibase.env
          cd /opt/liquibase-runner
          if [ -d "repo/.git" ]; then
            cd repo; git fetch origin; git checkout ${SOURCE_BRANCH}; git pull origin ${SOURCE_BRANCH}
          else
            git clone https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git repo
            cd repo; git checkout ${SOURCE_BRANCH}
          fi
          git remote set-url origin https://github.com/${{ github.repository }}.git
          echo "Workspace ready on branch: ${SOURCE_BRANCH}"
          EOF
          )
          ENCODED=$(echo "$SCRIPT" | base64 -w 0)
          COMMAND_ID=$(aws ssm send-command --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[\"echo $ENCODED | base64 -d | bash\"]" \
            --region "$AWS_REGION" --query "Command.CommandId" --output text)
          bash .github/scripts/wait-ssm.sh "$COMMAND_ID" "$INSTANCE_ID" "$AWS_REGION"

      # ── Install Java ──────────────────────────────────────────
      - name: Install Java on EC2
        if: steps.resolve.outputs.SKIP_DEPLOY != 'true'
        run: |
          SCRIPT=$(cat <<'EOF'
          #!/bin/bash
          set -e
          if java -version >/dev/null 2>&1; then
            echo "Java already installed"; java -version
          else
            echo "Installing Java 17..."
            if command -v apt-get >/dev/null 2>&1; then
              sudo apt-get update -qq && sudo apt-get install -y openjdk-17-jre-headless
            elif command -v yum >/dev/null 2>&1; then
              sudo yum install -y java-17-amazon-corretto
            else
              echo "ERROR: no supported package manager"; exit 1
            fi
          fi
          EOF
          )
          ENCODED=$(echo "$SCRIPT" | base64 -w 0)
          COMMAND_ID=$(aws ssm send-command --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[\"echo $ENCODED | base64 -d | bash\"]" \
            --region "$AWS_REGION" --query "Command.CommandId" --output text)
          bash .github/scripts/wait-ssm.sh "$COMMAND_ID" "$INSTANCE_ID" "$AWS_REGION"

      # ── Install Liquibase ─────────────────────────────────────
      - name: Install Liquibase on EC2
        if: steps.resolve.outputs.SKIP_DEPLOY != 'true'
        run: |
          SCRIPT=$(cat <<EOF
          #!/bin/bash
          set -e
          if ! command -v yq &>/dev/null; then
            wget -q https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 \
              -O /usr/local/bin/yq && chmod +x /usr/local/bin/yq
          fi
          INSTALL_DIR="/opt/liquibase/${LB_VERSION}"
          if [ ! -f "\$INSTALL_DIR/liquibase" ]; then
            sudo mkdir -p "\$INSTALL_DIR/lib"; cd /tmp
            wget -q https://github.com/liquibase/liquibase/releases/download/v${LB_VERSION}/liquibase-${LB_VERSION}.tar.gz
            tar -xzf liquibase-${LB_VERSION}.tar.gz -C "\$INSTALL_DIR"
            sudo ln -sf "\$INSTALL_DIR/liquibase" /usr/local/bin/liquibase
            sudo chmod +x "\$INSTALL_DIR/liquibase"
          fi
          LIB_DIR="\$INSTALL_DIR/lib"
          DRIVER="mysql-connector-java-${MYSQL_DRIVER_VERSION}.jar"
          if [ ! -f "\$LIB_DIR/\$DRIVER" ]; then
            curl -fL "https://repo1.maven.org/maven2/mysql/mysql-connector-java/${MYSQL_DRIVER_VERSION}/\$DRIVER" \
              -o "/tmp/\$DRIVER"; sudo mv "/tmp/\$DRIVER" "\$LIB_DIR/"
          fi
          EXT="liquibase-mongodb-${MONGO_EXT_VERSION}.jar"
          if [ ! -f "\$LIB_DIR/\$EXT" ]; then
            curl -fL "https://repo1.maven.org/maven2/org/liquibase/ext/liquibase-mongodb/${MONGO_EXT_VERSION}/\$EXT" \
              -o "/tmp/\$EXT"; sudo mv "/tmp/\$EXT" "\$LIB_DIR/"
          fi
          for artifact in mongodb-driver-sync mongodb-driver-core bson; do
            JAR="\${artifact}-${MONGO_DRIVER_VERSION}.jar"
            if [ ! -f "\$LIB_DIR/\$JAR" ]; then
              curl -fL "https://repo1.maven.org/maven2/org/mongodb/\${artifact}/${MONGO_DRIVER_VERSION}/\$JAR" \
                -o "/tmp/\$JAR"; sudo mv "/tmp/\$JAR" "\$LIB_DIR/"
            fi
          done
          sudo chmod 644 \$LIB_DIR/*.jar; liquibase --version
          EOF
          )
          ENCODED=$(echo "$SCRIPT" | base64 -w 0)
          COMMAND_ID=$(aws ssm send-command --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[\"echo $ENCODED | base64 -d | bash\"]" \
            --region "$AWS_REGION" --query "Command.CommandId" --output text)
          bash .github/scripts/wait-ssm.sh "$COMMAND_ID" "$INSTANCE_ID" "$AWS_REGION"

      # ── Liquibase Validate ────────────────────────────────────
      - name: Liquibase Validate on EC2
        if: steps.resolve.outputs.SKIP_DEPLOY != 'true'
        run: |
          REGION_ARG="none"
          if [[ "$SELECTED_ENV" == "prod" ]]; then REGION_ARG="$SELECTED_REGION"; fi

          LB_CMD="bash /opt/liquibase-runner/repo/run-liquibase.sh $SELECTED_ENV validate $REGION_ARG"
          echo "Running: $LB_CMD"

          SCRIPT=$(cat <<EOF
          #!/bin/bash
          set -e
          sed -i 's/\r//' /opt/liquibase-runner/env/liquibase.env
          mkdir -p /opt/liquibase-runner/repo/env
          cp /opt/liquibase-runner/env/liquibase.env /opt/liquibase-runner/repo/env/liquibase.env
          source /opt/liquibase-runner/env/liquibase.env
          chmod +x /opt/liquibase-runner/repo/run-liquibase.sh
          $LB_CMD
          EOF
          )

          ENCODED=$(echo "$SCRIPT" | base64 -w 0)
          COMMAND_ID=$(aws ssm send-command --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[\"echo $ENCODED | base64 -d | bash\"]" \
            --region "$AWS_REGION" --query "Command.CommandId" --output text)
          bash .github/scripts/wait-ssm.sh "$COMMAND_ID" "$INSTANCE_ID" "$AWS_REGION"

      # ── Scale DOWN (always, even on failure) ──────────────────
      - name: Scale Down ASG (1 → 0)
        if: always() && steps.resolve.outputs.SKIP_DEPLOY != 'true'
        run: |
          aws autoscaling update-auto-scaling-group \
            --auto-scaling-group-name "$ASG_NAME" \
            --min-size 0 --desired-capacity 0 --max-size 0 --region "$AWS_REGION"
          echo "ASG scaled down"

      - name: Cleanup secrets
        if: always()
        run: rm -f env/liquibase.env config/versions.json

  # ────────────────────────────────────────────────────────────────
  # Job 2: Apply changesets (liquibase update)
  # ────────────────────────────────────────────────────────────────
  update:
    name: liquibase update (${{ needs.validate.outputs.selected-env }})
    runs-on: ubuntu-latest
    needs: [validate]
    if: needs.validate.outputs.skip-deploy != 'true'
    permissions:
      id-token: write
      contents: read

    env:
      SELECTED_ENV:         ${{ needs.validate.outputs.selected-env }}
      SELECTED_REGION:      ${{ needs.validate.outputs.selected-region }}
      AWS_REGION:           ${{ needs.validate.outputs.aws-region }}
      ASG_NAME:             ${{ needs.validate.outputs.asg-name }}
      APPCONFIG_APP:        ${{ needs.validate.outputs.appconfig-app }}
      APPCONFIG_ENV:        ${{ needs.validate.outputs.appconfig-env }}
      ROLE_ARN:             ${{ needs.validate.outputs.role-arn }}
      LB_VERSION:           ${{ needs.validate.outputs.lb-version }}
      MYSQL_DRIVER_VERSION: ${{ needs.validate.outputs.mysql-driver-version }}
      MONGO_EXT_VERSION:    ${{ needs.validate.outputs.mongo-ext-version }}
      MONGO_DRIVER_VERSION: ${{ needs.validate.outputs.mongo-driver-version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # ── Scale UP ──────────────────────────────────────────────
      - name: Scale Up ASG (0 → 1)
        run: |
          aws autoscaling update-auto-scaling-group \
            --auto-scaling-group-name "$ASG_NAME" \
            --min-size 1 --desired-capacity 1 --max-size 1 --region "$AWS_REGION"

      - name: Wait for EC2 Instance
        run: |
          MAX_WAIT=300; ELAPSED=0
          while true; do
            INSTANCE_ID=$(aws autoscaling describe-auto-scaling-groups \
              --auto-scaling-group-names "$ASG_NAME" --region "$AWS_REGION" \
              --query "AutoScalingGroups[0].Instances[?LifecycleState=='InService'].InstanceId" --output text)
            if [[ -n "$INSTANCE_ID" && "$INSTANCE_ID" != "None" ]]; then
              echo "INSTANCE_ID=$INSTANCE_ID" >> $GITHUB_ENV; echo "Instance: $INSTANCE_ID"; break
            fi
            [[ $ELAPSED -ge $MAX_WAIT ]] && { echo "ERROR: Timed out"; exit 1; }
            echo "Waiting... ($ELAPSED s)"; sleep 15; ELAPSED=$((ELAPSED + 15))
          done

      - name: Wait for SSM Agent
        run: |
          MAX_WAIT=300; ELAPSED=0
          while true; do
            STATUS=$(aws ssm describe-instance-information --region "$AWS_REGION" \
              --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
              --query "InstanceInformationList[0].PingStatus" --output text 2>/dev/null || echo "NotReady")
            [[ "$STATUS" == "Online" ]] && { echo "SSM Online"; break; }
            [[ $ELAPSED -ge $MAX_WAIT ]] && { echo "ERROR: Timed out"; exit 1; }
            echo "SSM: $STATUS ($ELAPSED s)"; sleep 15; ELAPSED=$((ELAPSED + 15))
          done

      - name: Fetch liquibase.env from AppConfig
        run: |
          mkdir -p env
          TOKEN=$(aws appconfigdata start-configuration-session \
            --application-identifier "$APPCONFIG_APP" --environment-identifier "$APPCONFIG_ENV" \
            --configuration-profile-identifier liquibase-env --region "$AWS_REGION" \
            --query InitialConfigurationToken --output text)
          aws appconfigdata get-latest-configuration --configuration-token "$TOKEN" \
            --region "$AWS_REGION" env/liquibase.env

      - name: Setup EC2 Workspace via SSM
        run: |
          SOURCE_BRANCH="master"
          ENV_ENCODED=$(base64 -w 0 env/liquibase.env)
          GH_TOKEN="${{ secrets.GH_PAT }}"
          SCRIPT=$(cat <<EOF
          #!/bin/bash
          set -e
          mkdir -p /opt/liquibase-runner/env
          echo "${ENV_ENCODED}" | base64 -d > /opt/liquibase-runner/env/liquibase.env
          cd /opt/liquibase-runner
          if [ -d "repo/.git" ]; then
            cd repo; git fetch origin; git checkout ${SOURCE_BRANCH}; git pull origin ${SOURCE_BRANCH}
          else
            git clone https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git repo
            cd repo; git checkout ${SOURCE_BRANCH}
          fi
          git remote set-url origin https://github.com/${{ github.repository }}.git
          echo "Workspace ready on branch: ${SOURCE_BRANCH}"
          EOF
          )
          ENCODED=$(echo "$SCRIPT" | base64 -w 0)
          COMMAND_ID=$(aws ssm send-command --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[\"echo $ENCODED | base64 -d | bash\"]" \
            --region "$AWS_REGION" --query "Command.CommandId" --output text)
          bash .github/scripts/wait-ssm.sh "$COMMAND_ID" "$INSTANCE_ID" "$AWS_REGION"

      - name: Install Liquibase on EC2
        run: |
          SCRIPT=$(cat <<EOF
          #!/bin/bash
          set -e
          if ! command -v yq &>/dev/null; then
            wget -q https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 \
              -O /usr/local/bin/yq && chmod +x /usr/local/bin/yq
          fi
          INSTALL_DIR="/opt/liquibase/${LB_VERSION}"
          if [ ! -f "\$INSTALL_DIR/liquibase" ]; then
            sudo mkdir -p "\$INSTALL_DIR/lib"; cd /tmp
            wget -q https://github.com/liquibase/liquibase/releases/download/v${LB_VERSION}/liquibase-${LB_VERSION}.tar.gz
            tar -xzf liquibase-${LB_VERSION}.tar.gz -C "\$INSTALL_DIR"
            sudo ln -sf "\$INSTALL_DIR/liquibase" /usr/local/bin/liquibase
            sudo chmod +x "\$INSTALL_DIR/liquibase"
          fi
          LIB_DIR="\$INSTALL_DIR/lib"
          DRIVER="mysql-connector-java-${MYSQL_DRIVER_VERSION}.jar"
          if [ ! -f "\$LIB_DIR/\$DRIVER" ]; then
            curl -fL "https://repo1.maven.org/maven2/mysql/mysql-connector-java/${MYSQL_DRIVER_VERSION}/\$DRIVER" \
              -o "/tmp/\$DRIVER"; sudo mv "/tmp/\$DRIVER" "\$LIB_DIR/"
          fi
          EXT="liquibase-mongodb-${MONGO_EXT_VERSION}.jar"
          if [ ! -f "\$LIB_DIR/\$EXT" ]; then
            curl -fL "https://repo1.maven.org/maven2/org/liquibase/ext/liquibase-mongodb/${MONGO_EXT_VERSION}/\$EXT" \
              -o "/tmp/\$EXT"; sudo mv "/tmp/\$EXT" "\$LIB_DIR/"
          fi
          for artifact in mongodb-driver-sync mongodb-driver-core bson; do
            JAR="\${artifact}-${MONGO_DRIVER_VERSION}.jar"
            if [ ! -f "\$LIB_DIR/\$JAR" ]; then
              curl -fL "https://repo1.maven.org/maven2/org/mongodb/\${artifact}/${MONGO_DRIVER_VERSION}/\$JAR" \
                -o "/tmp/\$JAR"; sudo mv "/tmp/\$JAR" "\$LIB_DIR/"
            fi
          done
          sudo chmod 644 \$LIB_DIR/*.jar; liquibase --version
          EOF
          )
          ENCODED=$(echo "$SCRIPT" | base64 -w 0)
          COMMAND_ID=$(aws ssm send-command --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[\"echo $ENCODED | base64 -d | bash\"]" \
            --region "$AWS_REGION" --query "Command.CommandId" --output text)
          bash .github/scripts/wait-ssm.sh "$COMMAND_ID" "$INSTANCE_ID" "$AWS_REGION"

      # ── Liquibase Update ──────────────────────────────────────
      - name: Liquibase Update on EC2
        run: |
          REGION_ARG="none"
          if [[ "$SELECTED_ENV" == "prod" ]]; then REGION_ARG="$SELECTED_REGION"; fi

          LB_CMD="bash /opt/liquibase-runner/repo/run-liquibase.sh $SELECTED_ENV update $REGION_ARG"
          echo "Running: $LB_CMD"

          SCRIPT=$(cat <<EOF
          #!/bin/bash
          set -e
          sed -i 's/\r//' /opt/liquibase-runner/env/liquibase.env
          mkdir -p /opt/liquibase-runner/repo/env
          cp /opt/liquibase-runner/env/liquibase.env /opt/liquibase-runner/repo/env/liquibase.env
          source /opt/liquibase-runner/env/liquibase.env
          chmod +x /opt/liquibase-runner/repo/run-liquibase.sh
          $LB_CMD
          EOF
          )

          ENCODED=$(echo "$SCRIPT" | base64 -w 0)
          COMMAND_ID=$(aws ssm send-command --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[\"echo $ENCODED | base64 -d | bash\"]" \
            --region "$AWS_REGION" --query "Command.CommandId" --output text)
          bash .github/scripts/wait-ssm.sh "$COMMAND_ID" "$INSTANCE_ID" "$AWS_REGION"

      # ── Scale DOWN (always) ───────────────────────────────────
      - name: Scale Down ASG (1 → 0)
        if: always()
        run: |
          aws autoscaling update-auto-scaling-group \
            --auto-scaling-group-name "$ASG_NAME" \
            --min-size 0 --desired-capacity 0 --max-size 0 --region "$AWS_REGION"
          echo "ASG scaled down"

      - name: Cleanup secrets
        if: always()
        run: rm -f env/liquibase.env
